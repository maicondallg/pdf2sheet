[project]
name = "pdf2sheet"
version = "0.1.0"
description = "Convert PDFs arranged in a two-level folder hierarchy into a formatted Excel workbook."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdf2image>=1.17",
    "openpyxl>=3.1",
]

[project.scripts]
pdf2sheet = "pdf2sheet:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
